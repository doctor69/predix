<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Badge -->
  <rect width="64" height="64" rx="14" fill="url(#g)"/>
  <rect width="64" height="64" rx="14" fill="none"
        stroke="rgba(255,255,255,0.2)" stroke-width="1.2"/>

  <!-- Fork icon -->
  <g filter="url(#glow)">
    <line x1="14" y1="46" x2="26" y2="36" stroke="white" stroke-width="3"
          stroke-linecap="round"/>
    <polyline points="26,36 38,22 50,27" stroke="#4ade80" stroke-width="3"
              stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <polyline points="26,36 38,44 50,39" stroke="#f87171" stroke-width="3"
              stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="26" cy="36" r="3" fill="white"/>
    <circle cx="50" cy="27" r="2.5" fill="#4ade80"/>
    <circle cx="50" cy="39" r="2.5" fill="#f87171"/>
  </g>
</svg>
