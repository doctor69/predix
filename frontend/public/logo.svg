<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 72" fill="none">
  <defs>
    <linearGradient id="badge-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Badge background: rounded square -->
  <rect x="0" y="4" width="64" height="64" rx="16" fill="url(#badge-grad)"/>

  <!-- Subtle inner highlight -->
  <rect x="0" y="4" width="64" height="64" rx="16"
        fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.2"/>

  <!-- Icon: prediction fork -->
  <g filter="url(#glow)">
    <line x1="18" y1="46" x2="30" y2="36" stroke="white" stroke-width="3.2"
          stroke-linecap="round"/>
    <polyline points="30,36 42,24 52,28" stroke="#4ade80" stroke-width="3.2"
              stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <polyline points="30,36 42,44 52,40" stroke="#f87171" stroke-width="3.2"
              stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="30" cy="36" r="3" fill="white"/>
    <circle cx="52" cy="28" r="2.5" fill="#4ade80"/>
    <circle cx="52" cy="40" r="2.5" fill="#f87171"/>
  </g>

  <!-- Wordmark: PREDIX -->
  <text x="80" y="51"
        font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
        font-size="36" font-weight="700" letter-spacing="3"
        fill="url(#text-grad)">PREDIX</text>
</svg>
