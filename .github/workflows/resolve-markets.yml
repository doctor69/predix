name: Resolve Markets

on:
  # PAUSED — trigger manually via workflow_dispatch when ready
  # schedule:
  #   - cron: '0 */2 * * *'

  # Fire immediately when markets.yml is updated (admin sets outcome: yes/no)
  push:
    branches: [main]
    paths:
      - 'markets/markets.yml'

  # Manual trigger
  workflow_dispatch:
    inputs:
      network:
        description: 'Network'
        required: true
        default: 'polygonAmoy'
        type: choice
        options:
          - polygonAmoy
          - polygon
      buffer_mins:
        description: 'Minutes after resolutionTime before auto-resolving (default: 30)'
        required: false
        default: '30'
      confidence:
        description: 'Claude confidence threshold 0-100 for auto-resolve (default: 85)'
        required: false
        default: '85'

concurrency:
  group: resolve-markets
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve markets → ${{ inputs.network || 'polygonAmoy' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    defaults:
      run:
        working-directory: contracts

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: contracts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve eligible markets
        env:
          PRIVATE_KEY:               ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          AMOY_RPC:                  ${{ secrets.AMOY_RPC || 'https://rpc-amoy.polygon.technology' }}
          POLYGON_RPC:               ${{ secrets.POLYGON_RPC || 'https://polygon-bor-rpc.publicnode.com' }}
          CONTRACT_ADDRESS_AMOY:     ${{ vars.NEXT_PUBLIC_CONTRACT_ADDRESS }}
          CONTRACT_ADDRESS_POLYGON:  ${{ secrets.CONTRACT_ADDRESS_POLYGON }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
          RESOLVE_BUFFER_MINS:       ${{ inputs.buffer_mins || '30' }}
          CONFIDENCE_THRESHOLD:      ${{ inputs.confidence || '85' }}
        run: |
          NETWORK=${{ inputs.network || 'polygonAmoy' }}
          npx hardhat run scripts/resolve-markets.ts --network $NETWORK

      # Commit back if admin outcomes were consumed from markets.yml
      - name: Commit cleared outcome flags
        run: |
          cd $GITHUB_WORKSPACE
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add markets/markets.yml
          git diff --staged --quiet \
            && echo "No YAML changes to commit" \
            || git commit -m "chore: clear resolved market outcomes from markets.yml [skip ci]"
          git push
