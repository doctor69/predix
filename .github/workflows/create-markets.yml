name: Create Markets

on:
  push:
    branches: [main]
    paths:
      - 'markets/markets.yml'
  workflow_dispatch:
    inputs:
      network:
        description: 'Network to deploy to'
        required: true
        default: 'polygonAmoy'
        type: choice
        options:
          - polygonAmoy
          - polygon

jobs:
  create:
    name: Deploy new markets to ${{ inputs.network || 'polygonAmoy' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit contractIds back to the repo

    defaults:
      run:
        working-directory: contracts

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so we can commit back
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: contracts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create markets on-chain
        env:
          PRIVATE_KEY:               ${{ secrets.ADMIN_PRIVATE_KEY }}
          AMOY_RPC:                  ${{ secrets.AMOY_RPC || 'https://rpc-amoy.polygon.technology' }}
          POLYGON_RPC:               ${{ secrets.POLYGON_RPC || 'https://polygon-bor-rpc.publicnode.com' }}
          CONTRACT_ADDRESS_AMOY:     ${{ secrets.CONTRACT_ADDRESS_AMOY }}
          CONTRACT_ADDRESS_POLYGON:  ${{ secrets.CONTRACT_ADDRESS_POLYGON }}
        run: |
          NETWORK=${{ inputs.network || 'polygonAmoy' }}
          npx hardhat run scripts/create-markets.ts --network $NETWORK

      - name: Commit updated contractIds back to repo
        run: |
          cd $GITHUB_WORKSPACE
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add markets/markets.yml
          git diff --staged --quiet && echo "No changes to commit" || \
            git commit -m "chore: fill contractIds after market deployment [skip ci]"
          git push
