name = "predix-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
FRONTEND_URL = "https://predix.vip,https://www.predix.vip,https://predix-jfg.pages.dev"

# Secrets — set via CLI before deploying:
#   wrangler secret put DATABASE_URL
#   wrangler secret put PRIVY_APP_ID
#   wrangler secret put ADMIN_ADDRESSES
#   wrangler secret put ANTHROPIC_API_KEY

# Uncomment after you point predix.xyz to Cloudflare:
# [[routes]]
# pattern = "api.predix.xyz/*"
# zone_name = "predix.xyz"
