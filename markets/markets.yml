# Predix Market Definitions
#
# HOW TO ADD A MARKET:
#   1. Add a new entry below (copy an existing one)
#   2. Set contractId to null
#   3. Commit and push to main
#   4. GitHub Actions will deploy it and fill in the contractId automatically
#
# TIMESTAMPS: ISO 8601 format, UTC  e.g. "2026-12-31T23:59:00Z"
#   closingTime    — when betting stops (no more YES/NO bets after this)
#   resolutionTime — deadline for you to resolve the market
#
# IMAGE URLS: use a direct image link (Unsplash, etc.) 800px wide recommended
# RESOLUTION SOURCE: where you'll look to resolve (e.g. "CoinGecko", "BBC News")

markets:
  - question: Will Bitcoin reach $150,000 by end of 2026?
    category: Crypto
    imageUrl: https://images.unsplash.com/photo-1518546305927-5a555bb7020d?w=800
    resolutionSource: CoinGecko
    closingTime: '2026-11-30T23:59:00Z'
    resolutionTime: '2026-12-31T23:59:00Z'
    contractId: 11
  - question: Will India win the 2026 T20 World Cup?
    category: Sports
    imageUrl: https://images.unsplash.com/photo-1540747913346-19212a4f434a?w=800
    resolutionSource: ICC Official Website
    closingTime: '2026-10-01T00:00:00Z'
    resolutionTime: '2026-10-31T00:00:00Z'
